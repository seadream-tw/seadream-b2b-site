<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <small>SEADREAM AQUARIUM WHOLESALE</small>
        <h1>設備批發 2026 管理版 v6</h1>
        <p>支援修改批發價、一般價、圖片、尺寸、耗電量、注意事項與使用說明；請勿傳給客戶。</p>
      </div>
      <div class="headActions">
        <span class="badge">一般 USER 價 / 批發價 同時顯示</span>
        <span class="badge" id="modeBadge">管理版：未登入</span>
        <button class="btn line adminHead" id="adminLoginBtn">管理登入</button>
        <button class="btn line adminHead adminTools" id="exportPriceMapBtn">匯出價格</button>
        <button class="btn line adminHead adminTools" id="importPriceMapBtn">匯入價格</button>
        <button class="btn line adminHead adminTools" id="exportImgMapBtn">匯出圖片</button>
        <button class="btn line adminHead adminTools" id="importImgMapBtn">匯入圖片</button>
        <button class="btn line adminHead adminTools" id="exportDetailMapBtn">匯出詳細資料</button>
        <button class="btn line adminHead adminTools" id="importDetailMapBtn">匯入詳細資料</button>
        <input type="file" id="importImgFile" accept="application/json" class="hidden">
        <input type="file" id="importDetailFile" accept="application/json" class="hidden">
        <input type="file" id="importPriceFile" accept="application/json" class="hidden">
      </div>
    </div>
  </div>
</header>

<div id="appView">
  <div class="wrap">
    <div class="panel" style="margin-top:16px">
      <div class="bd">
        <div class="controls">
          <input id="searchInput" class="input" placeholder="搜尋品名 / 品牌 / 關鍵字 / SKU，例如 Hydra、Aquaforest、UM220IN">
          <select id="brandSelect" class="select"></select>
          <select id="sortSelect" class="select">
            <option value="default">排序：預設</option><option value="brand">排序：品牌</option><option value="name">排序：品名</option><option value="uAsc">USER價 低 → 高</option><option value="uDesc">USER價 高 → 低</option><option value="wAsc">批發價 低 → 高</option><option value="wDesc">批發價 高 → 低</option>
          </select>
          <button class="btn primary" id="resetFilterBtn">重設篩選</button>
        </div>
        <div style="height:10px"></div>
        <div class="switchRow">
          <label class="switch"><input type="checkbox" id="onlyHasImage"> 只看已有圖片</label>
          <label class="switch"><input type="checkbox" id="showCartThumb" checked> 報價單顯示縮圖</label>
          <label class="switch"><input type="checkbox" id="printWithImage" checked> 匯出報價單含圖片</label>
          <span class="helper">點商品「看圖片 / 詳情」可查看尺寸、耗電量、注意事項與使用說明。</span>
        </div>
        <div class="securityNote adminHead" id="securityNote">管理版需登入後才可改價格、圖片與詳細資料。客戶請使用「客戶下單版」，該版本不含修改入口。</div>
      </div>
    </div>

    <div class="layout">
      <aside class="panel sticky"><div class="hd"><strong>產品分類</strong><span class="metaCount" id="catInfo"></span></div><div class="bd"><div class="catList" id="catList"></div></div></aside>
      <main class="panel"><div class="hd"><strong>商品清單</strong><span class="metaCount" id="listInfo"></span></div><div class="bd"><div class="productGrid" id="productGrid"></div></div></main>
      <aside class="panel sticky quotePanel"><div class="hd"><strong>報價 / 下單總表</strong><span class="metaCount" id="cartCountText">0 項</span></div><div class="bd">
        <div class="quoteSummary"><div class="kpi"><b>一般 USER 價合計</b><strong id="sumUser">NT$ 0</strong></div><div class="kpi"><b>批發價總計</b><strong id="sumWh">NT$ 0</strong></div><div class="kpi"><b>同行省下</b><strong id="sumSave">NT$ 0</strong></div><div class="kpi"><b>已選數量</b><strong id="sumQty">0</strong></div></div>
        <div class="customerForm"><input id="qNo" class="input" placeholder="報價單號"><input id="qDate" class="input" placeholder="日期"><input id="qName" class="input" placeholder="批發商 / 客戶名稱"><input id="qContact" class="input" placeholder="聯絡人 / 電話 / LINE"><textarea id="qMemo" class="input full" rows="3" placeholder="備註：交期、運費、保固、付款條件... "></textarea></div>
        <div class="cartList" id="cartList"></div>
        <div class="actions"><button class="btn dark" id="previewBtn">報價單預覽 / 另存 PDF</button><button class="btn gold" id="excelBtn">匯出 Excel</button><button class="btn" id="htmlBtn">下載報價 HTML</button><button class="btn" id="backupBtn">備份目前訂單</button><button class="btn" id="restoreBtn">匯入訂單</button><button class="btn red" id="clearCartBtn">清空目前報價</button><input type="file" id="restoreFile" accept="application/json" class="hidden"></div>
      </div></aside>
    </div>
  </div>
</div>

<div class="previewBar hidden" id="previewBar"><button class="btn" id="backBtn">返回修改</button><button class="btn primary" onclick="window.print()">列印 / 另存 PDF</button><button class="btn dark" id="previewHtmlBtn">下載報價單 HTML</button><button class="btn gold" id="previewExcelBtn">匯出 Excel 報價單</button></div>
<div class="previewView" id="previewView"></div>

<div class="modal" id="detailModal"><div class="modalCard"><div class="modalHd"><strong id="modalTitle">商品詳情</strong><button class="btn small" id="modalCloseBtn">關閉</button></div><div class="modalBd" id="modalBody"></div></div></div>

function renderBrands(){el.brand.innerHTML=uniqueBrands().map(b=>`<option value="${esc(b)}">品牌：${esc(b)}</option>`).join(''); el.brand.value=ui.brand||'全部'}function renderCats(){const counts=categoryCounts(); const cats=['全部',...Array.from(new Set(ITEMS.map(x=>x.cat))).sort((a,b)=>a.localeCompare(b,'zh-Hant'))]; el.catList.innerHTML=cats.map(cat=>`<button class="catBtn ${ui.cat===cat?'active':''}" data-cat="${esc(cat)}">${esc(cat)} <span class="metaCount">${counts[cat]||0}</span></button>`).join(''); el.catInfo.textContent=`${counts[ui.cat]||0} 項`; $$('.catBtn').forEach(btn=>btn.onclick=()=>{ui.cat=btn.dataset.cat; saveUi(); renderAll();})}

function calcTotals(){let user=0,wh=0,qty=0,lines=0; Object.keys(cart).forEach(sku=>{const it=bySku(sku); if(!it)return; const q=Math.max(0,parseInt(cart[sku].qty||0)); if(!q)return; const p=getPricing(it); lines++; qty+=q; user+=p.u*q; wh+=p.w*q;}); return {user,wh,save:Math.max(0,user-wh),qty,lines}}

function renderAll(){renderBrands(); renderCats(); renderProducts(); renderCart(); syncFilterControls(); updateAdminUi()}function syncFilterControls(){el.search.value=ui.search||''; el.sort.value=ui.sort||'default'; el.onlyHasImage.checked=!!ui.onlyHasImage; el.showCartThumb.checked=!!ui.showCartThumb; el.printWithImage.checked=!!ui.printWithImage}

function detailDisplayHtml(it){const dt=getDetails(it); const filled=DETAIL_FIELDS.filter(f=>stripNa(dt[f.key])); if(!filled.length) return '<div class="detailBox" style="margin-top:10px"><div class="helper">詳細資料</div><div class="detailValue">尚未填寫尺寸、耗電量、注意事項或使用說明。</div></div>'; return '<div class="detailGrid">'+filled.map(f=>`<div class="detailBox"><div class="helper">${esc(f.label)}</div><div class="detailValue">${esc(dt[f.key])}</div></div>`).join('')+'</div>'}
function adminFormsHtml(it){if(!adminUnlocked) return ''; const p=getPricing(it), dt=getDetails(it); const fields=DETAIL_FIELDS.map(f=>{const value=esc(dt[f.key]||''); if(f.type==='textarea') return `<label class="${['usage','precaution','install','package','compat','maintenance','detailNote'].includes(f.key)?'full':''}"><div class="helper">${esc(f.label)}</div><textarea class="input detailField" data-key="${esc(f.key)}" rows="3">${value}</textarea></label>`; return `<label><div class="helper">${esc(f.label)}</div><input class="input detailField" data-key="${esc(f.key)}" value="${value}" placeholder="${esc(f.label)}"></label>`}).join(''); return `<div class="adminBlock"><strong>價格 / 銷售設定</strong><div class="helper">這裡可修改一般 USER 價、批發價、狀態與銷售備註。修改會儲存在這台裝置的瀏覽器中，可用「匯出價格」備份。</div><div class="adminGrid"><label><div class="helper">一般 USER 價</div><input id="admUserPrice" class="input" type="number" inputmode="numeric" value="${p.u}"></label><label><div class="helper">批發價</div><input id="admWhPrice" class="input" type="number" inputmode="numeric" value="${p.w}"></label><label><div class="helper">狀態</div><input id="admStatus" class="input" value="${esc(p.s)}"></label><label><div class="helper">批價 / 銷售備註</div><input id="admNote" class="input" value="${esc(p.note)}"></label></div><div class="row"><button class="btn primary" onclick="saveModalPrice('${esc(it.sku)}')">儲存價格</button><button class="btn red" onclick="clearPrice('${esc(it.sku)}')">還原原始價格</button><button class="btn" onclick="exportPriceMap()">匯出價格 JSON</button></div></div><div class="adminBlock"><strong>圖片管理</strong><div class="row"><input id="modalImgUrl" class="input" placeholder="輸入圖片網址或相對路徑" value="${esc((imgOverrides[it.sku]||{}).main||it.img||'')}"><button class="btn primary" onclick="saveModalImageUrl('${esc(it.sku)}')">儲存圖片網址</button><button class="btn" onclick="pickImage('${esc(it.sku)}')">上傳主圖</button><button class="btn red" onclick="clearImage('${esc(it.sku)}')">清除圖片</button></div></div><div class="adminBlock function openDetail(sku){const it=bySku(sku); if(!it)return; currentModalSku=sku; const imgs=getImageSet(it), hero=imgs[0]||'', p=getPricing(it); el.modalTitle.textContent=`${it.n} ｜ ${it.sku}`; el.modalBody.innerHTML=`<div class="gallery"><div><div class="hero" id="heroBox">${hero?`<img src="${esc(hero)}" alt="${esc(it.n)}">`:`<div class="ph">${esc(it.n)}<br><span style="font-size:12px">暫無圖片</span></div>`}</div><div class="galleryThumbs">${imgs.length?imgs.map(src=>`<div class="galleryThumb" onclick="setHero('${esc(src)}')"><img src="${esc(src)}" alt=""></div>`).join(''):''}</div></div><div><div class="brandline"><span class="brandTag">${esc(it.b)}</span><span class="status ${statusClass(p.s)}">${esc(p.s)}</span><span class="brandTag">${esc(it.cat)}</span></div><h2 style="margin:8px 0 0">${esc(it.n)}</h2><div class="detailGrid"><div class="detailBox"><div class="helper">一般 USER 價</div><div style="font-size:22px;font-weight:900">${money(p.u)}</div></div><div class="detailBox"><div class="helper">批發價</div><div style="font-size:22px;font-weight:900;color:var(--red)">${money(p.w)}</div></div><div class="detailBox"><div class="helper">基本產品重點</div><div>${esc(it.d||'')}</div></div><div class="detailBox"><div class="helper">搜尋關鍵字</div><div>${esc(it.kw||'')}</div></div></div>${detailDisplayHtml(it)}${p.note?`<div class="detailBox" style="margin-top:10px"><div class="helper">批價 / 銷售備註</div><div>${esc(p.note)}</div></div>`:''}<div class="detailBox" style="margin-top:10px"><div class="helper">價格來源</div><div>${esc(it.src||'')}</div></div>${it.imgNote?`<div class="detailBox" style="margin-top:10px"><div class="helper">圖片說明</div><div>${esc(it.imgNote)}</div></div>`:''}${adminFormsHtml(it)}</div></div>`; el.detailModal.classList.add('show')}

function saveModalImageUrl(sku){const v=$('#modalImgUrl').value; setImageUrl(sku,v)}function saveModalDetails(sku){if(!requireAdmin()) return; const obj={}; $$('.detailField').forEach(input=>obj[input.dataset.key]=(input.value||'').trim()); const has=Object.values(obj).some(Boolean); if(has) detailOverrides[sku]=obj; else delete detailOverrides[sku]; saveDetail(); renderAll(); openDetail(sku)}function clearDetails(sku){if(!requireAdmin()) return; if(!confirm('要清除此商品目前填寫的詳細資料嗎？')) return; delete detailOverrides[sku]; saveDetail(); renderAll(); if(currentModalSku===sku) openDetail(sku)}function saveModalPrice(sku){if(!requireAdmin()) return; const obj={u:Math.max(0,parseInt($('#admUserPrice').value||0)||0),w:Math.max(0,parseInt($('#admWhPrice').value||0)||0),s:($('#admStatus').value||'正常').trim(),note:($('#admNote').value||'').trim()}; priceOverrides[sku]=obj; savePrice(); renderAll(); openDetail(sku)}function clearPrice(sku){if(!requireAdmin()) return; if(!confirm('要還原此商品的原始價格與備註嗎？')) return; delete priceOverrides[sku]; savePrice(); renderAll(); if(currentModalSku===sku) openDetail(sku)}

function cartKeys(){return Object.keys(cart).filter(sku=>(cart[sku]?.qty||0)>0)}function buildQuoteDoc(){saveInfo(); const keys=cartKeys(); if(!keys.length)return ''; const t=calcTotals(), withImg=ui.printWithImage; const rows=keys.map((sku,idx)=>{const it=bySku(sku),p=getPricing(it),q=cart[sku].qty,sub=p.w*q,img=getMainImage(it),spec=specSummary(it); return `<tr><td class="center">${idx+1}</td>${withImg?`<td class="center">${img?`<img src="${esc(img)}" alt="" style="width:60px;height:60px;object-fit:cover;border:1px solid #d8e4e4;border-radius:8px">`:'—'}</td>`:''}<td>${esc(it.n)}<div style="font-size:11px;color:#637c83">${esc(it.b)} ｜ ${esc(it.sku)}</div>${spec?`<div style="font-size:11px;color:#637c83">${esc(spec)}</div>`:''}</td><td class="num">${q}</td><td class="num">${money(p.u)}</td><td class="num">${money(p.w)}</td><td class="num">${money(sub)}</td></tr>`}).join(''); return `<div class="quoteDoc"><div class="head"><div><div class="title">SEADREAM AQUARIUM</div><div class="small">設備批發報價單 / WHOLESALE QUOTATION</div></div><div class="small" style="text-align:right;line-height:1.8">報價單號：${esc(el.qNo.value)}<br>日期：${esc(el.qDate.value)}<br>系統版本：${BUILD}</div></div><div class="to"><b>批發商 / 客戶：</b>${esc(el.qName.value||'未填寫')}<br><b>聯絡資訊：</b>${esc(el.qContact.value||'未填寫')}<br><b>備註：</b>${esc(el.qMemo.value||'無')}</div><table><thead><tr><th style="width:52px">項次</th>${withImg?'<th style="width:84px">圖片</th>':''}<th>商品</th><th style="width:70px">數量</th><th style="width:120px">一般價</th><th style="width:120px">批發價</th><th style="width:120px">小計</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="${withImg?5:4}" class="num">一般 USER 價合計</td><td class="num">${money(t.user)}</td><td></td></tr><tr><td colspan="${withImg?5:4}" class="num">同行省下</td><td class="num">${money(t.save)}</td><td></td></tr><tr><td colspan="${withImg?5:4}" class="num">批發價總計</td><td class="num">${money(t.wh)}</td><td></td></tr></tfoot></table><div class="footerNote">1. 本報價單供同行批發商參考，可依實際庫存、交 function showPreview(){const html=buildQuoteDoc(); if(!html){alert('報價單是空的，請先加入商品'); return;} el.previewView.innerHTML=html; el.previewView.classList.add('show'); el.previewBar.classList.remove('hidden'); el.appView.classList.add('hide'); window.scrollTo({top:0,behavior:'smooth'})}function backToApp(){el.previewBar.classList.add('hidden'); el.previewView.classList.remove('show'); el.appView.classList.remove('hide'); window.scrollTo({top:0,behavior:'smooth'})}function downloadQuoteHtml(){const html=buildQuoteDoc(); if(!html){alert('報價單是空的'); return;} const doc='<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(el.qNo.value)+' 批發報價單</title><style>'+document.querySelector('style').textContent+'</style></head><body style="background:#f2f6f6">'+html+'</body></html>'; const blob=new Blob([doc],{type:'text/html;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='批發報價單_'+(el.qNo.value||'SD')+'.html'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function backupOrder(){saveInfo(); exportJson({build:BUILD,cart,info:quoteInfo,ui},'SEADREAM_訂單備份_'+(el.qNo.value||'SD')+'.json')}function restoreOrder(file){importJson(file,data=>{cart=data.cart||{}; quoteInfo=Object.assign(quoteInfo,data.info||{}); if(data.ui){ui.showCartThumb=!!data.ui.showCartThumb; ui.printWithImage=!!data.ui.printWithImage;} saveCart(); saveUi(); localStorage.setItem(LS_INFO,JSON.stringify(quoteInfo)); initQuoteInfo()})}
function _u8(s){return new TextEncoder().encode(s)}function _sheet(rows){const escXml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); function col(n){let s=''; while(n>0){let m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26)} return s} let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'; rows.forEach((row,r)=>{xml+='<row r="'+(r+1)+'">'; row.forEach((cell,c)=>{const ref=col(c+1)+(r+1); if(cell===null||cell===undefined||cell==='') return; if(typeof cell==='number') xml+='<c r="'+ref+'"><v>'+cell+'</v></c>'; else xml+='<c r="'+ref+'" t="inlineStr"><is><t>'+escXml(cell)+'</t></is></c>';}); xml+='</row>';}); xml+='</sheetData></worksheet>'; return xml}function _zip(files){const crcTable=(()=>{let c,table=[]; for(let n=0;n<256;n++){c=n; for(let k=0;k<8;k++) c=((c&1)?(0xEDB88320^(c>>>1)):(c>>>1)); table[n]=c>>>0;} return table})(); const crc32=data=>{let crc=-1; for(let i=0;i<data.length;i++) crc=(crc>>>8)^crcTable[(crc^data[i])&0xFF]; return (crc^(-1))>>>0}; let central=[],offset=0,parts=[],enc=new TextEncoder(); files.forEach(file=>{const name=enc.encode(file.name),data=file.data,crc=crc32(data),size=data.length; const lh=new Uint8Array(30+name.length),lv=new DataView(lh.buffer); lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint32(14,crc,true); lv.setUint32(18,size,true); lv.setUint32(22,size,true); lv.setUint16(26,name.length,true); lh.set(name,30); parts.push(lh,data); const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer); cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true); cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true); ch.set(name,46); central.push(ch); offset+=lh.length+data.length}); const centralSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer); ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true); ev.setUint32(12,centralSize,true); ev.setUint32(16,offset,true); return new Blob([...parts,...central,end])}
function exportXlsx(){const keys=cartKeys(); if(!keys.length){alert('報價單是空的'); return;} const rows=[['SEADREAM AQUARIUM 批發報價單'],['報價單號',el.qNo.value,'','日期',el.qDate.value],['批發商',el.qName.value,'','聯絡',el.qContact.value],['備註',el.qMemo.value],[],['項次','品名','品牌','SKU','數量','一般USER價','批發單價','批發小計','規格重點']]; const t=calcTotals(); keys.forEach((sku,k)=>{const it=bySku(sku),p=getPricing(it),q=cart[sku].qty,sub=p.w*q; rows.push([k+1,it.n,it.b,it.sku,q,p.u,p.w,sub,specSummary(it)]);}); rows.push([]); rows.push(['','','','','','一般USER價合計','',t.user,'']); rows.push(['','','','','','同行省下','',t.save,'']); rows.push(['','','','','','批發價總計','',t.wh,'']); const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'; const rr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'; const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="報價單" sheetId="1" r:id="rId1"/></sheets></workbook>'; const wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'; const files=[{name:'[Content_Types].xml',data:_u8(ct)},{name:'_rels/.rels',data:_u8(rr)},{name:'xl/workbook.xml',data:_u8(wb)},{name:'xl/_rels/workbook.xml.rels',data:_u8(wbr)},{name:'xl/worksheets/sheet1.xml',data:_u8(_sheet(rows))}]; const blob=_zip(files); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='批發報價單_'+(el.qNo.value||'SD')+'.xlsx'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

ick=()=>$('#restoreFile').click(); $('#restoreFile').addEventListener('change',e=>{if(e.target.files[0]) restoreOrder(e.target.files[0]); e.target.value=''}); $('#clearCartBtn').onclick=clearCart; $('#modalCloseBtn').onclick=closeModal; el.detailModal.addEventListener('click',e=>{if(e.target===el.detailModal) closeModal()}); [el.qNo,el.qDate,el.qName,el.qContact,el.qMemo].forEach(node=>node.addEventListener('change',saveInfo));
